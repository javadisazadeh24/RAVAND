services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ravand
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_local}
      POSTGRES_DB: ravand_os
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ravand_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
volumes:
  ravand_pgdata:
